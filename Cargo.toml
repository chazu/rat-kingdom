[workspace]
resolver = "2"
members = [
    "crates/rk-core",
    "crates/rk-space",
    "crates/rk-git",
    "crates/rk-harness",
    "crates/rk-ledger",
    "crates/rk-sync",
    "crates/rk-workflow",
    "crates/rk-mux",
    "crates/rk-daemon",
    "crates/rk-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chazu/rat-kingdom"
rust-version = "1.88"

[workspace.dependencies]
rk-core = { path = "crates/rk-core" }
rk-space = { path = "crates/rk-space" }
rk-git = { path = "crates/rk-git" }
rk-harness = { path = "crates/rk-harness" }
rk-ledger = { path = "crates/rk-ledger" }
rk-sync = { path = "crates/rk-sync" }
rk-workflow = { path = "crates/rk-workflow" }
rk-mux = { path = "crates/rk-mux" }
rk-daemon = { path = "crates/rk-daemon" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "signal",
    "sync",
    "time",
    "fs",
] }
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
ratatui = "0.29"
schemars = { version = "0.8", features = ["chrono"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
libc = "0.2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
