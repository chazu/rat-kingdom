[tools]
rust = "1.95.0"
"cargo:cargo-nextest" = "0.9.143"

[env]
# Reinforce the Cargo profile setting for every repository task and any nested
# command invoked by mise.
CARGO_INCREMENTAL = "0"

[tasks.build]
description = "Build an optimized release build of rk"
run = "cargo build --release -p rk-cli"

[tasks.install]
description = "Build and install an optimized release build of rk"
run = "./scripts/install.sh"

[tasks.deploy]
description = "Build, install, and restart the daemon onto the freshly built rk binary"
run = """
./scripts/install.sh
RK="${RK_INSTALL_DIR:-$HOME/.local/bin}/rk"
"$RK" daemon stop || true
"$RK" ping >/dev/null
"$RK" daemon status
"""

[tasks.lint]
description = "Clippy over the whole workspace, warnings are errors"
# The committed tree is warning-clean under the pinned toolchain (TKT-180), so
# -D warnings is safe here and makes any output unambiguously YOUR change.
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the workspace test suite"
# This `env -u` list is load-bearing, not hygiene, and must stay identical to
# rk_core::review::STRIPPED_RK_SPAWN_ENV (see crates/rk-core/tests/
# mise_verify_env.rs, which fails this file out of sync with that constant).
# A rat's spawn env sets RK_AGENT, and rk_daemon::Client::connect reads it as
# the RPC `caller`; the daemon then refuses operator-only methods
# (workflow.run, agent.spawn, ...) with `forbidden`. So the suite passes for a
# human and fails for every rat running the very command its completion
# protocol demands. Tracked: TKT-182. The RK_REVIEW_* vars are the exact-review
# binding a spawned reviewer carries; leaving them set here leaks into any
# nested test that itself exercises reviewer-role writes (e.g.
# reviewer_drives_rework.rs's synthetic reviewer subprocess), which then
# mismatches its own synthetic RK_TASK and is rejected as forbidden.
# `--no-fail-fast` reports every failing integration-test binary in one run;
# compilation errors still stop before tests, and any test failure still makes
# the task fail.
run = "env -u RK_AGENT -u RK_TASK -u RK_REPO -u RK_ROLE -u RK_HOME -u RK_BRANCH -u RK_WORKTREE -u RK_AUTH_TOKEN -u RK_REVIEW_BRANCH -u RK_REVIEW_HEAD -u RK_REVIEW_TARGET -u RK_REVIEW_TASK -u RK_REVIEW_ATTEMPT cargo test --workspace --no-fail-fast"

[tasks.verify]
description = "Fast verification of changed Rust packages and their reverse dependencies"
run = "./scripts/verify-changed.sh"

[tasks.verify-full]
description = "Full workspace build, test, and lint — reserved for CI and protected-final landing"
# Mirrors .github/workflows/ci.yml step-for-step (fmt, clippy --all-targets,
# test) so the protected-final landing gate and CI keep the same full profile.
# Previously verify ran neither
# `cargo fmt --check` nor clippy against test/bench targets, so CI and
# reviewers caught fmt/clippy issues verify had already reported clean.
# See [tasks.test] above for why the `env -u` list must stay the full
# strip_rk_spawn set, not just RK_AGENT.
#
# TKT-dagom-lajub-hijug: the test phase runs cargo-nextest (already pinned
# above and already used by `verify`/verify-changed.sh) instead of
# `cargo test --workspace`, because nextest runs test binaries concurrently
# while `cargo test` runs them one at a time — that serialization is why the
# old single-command test phase dominated protected-final's wall time.
# `--test-threads 4` matches this repo's existing single-host concurrency
# bound (.cargo/config.toml's `[build] jobs = 4`, chosen for the same
# single-operator-castle disk/CPU-sharing reason) rather than nextest's
# default of every logical core; it does not bound child-thread/test-internal
# fan-out inside a test process, or any unrelated build sharing this host.
# Nextest does not run doctests (https://nexte.st/docs/running/), so the
# explicit `cargo test --workspace --doc` step below preserves that category.
# It is a no-op today — this workspace has zero runnable doc-code-fences,
# verified 2026-09-14 (crates/rk-git/src/lib.rs's only fence is ```text,
# which rustdoc never executes) — but load-bearing the moment one is added.
# Likewise, the workspace has no #[ignore] tests, [[bench]]/[[example]]
# targets, or harness = false test targets (verified 2026-09-14), so
# nextest's coverage of the existing test inventory is equivalent to
# `cargo test --workspace`'s for every category actually present.
# See crates/rk-core/tests/verify_full_recipe_regression.rs for command-level
# proof that a broken fixture still fails each phase.
run = """
cargo fmt --all --check
cargo build --workspace
env -u RK_AGENT -u RK_TASK -u RK_REPO -u RK_ROLE -u RK_HOME -u RK_BRANCH -u RK_WORKTREE -u RK_AUTH_TOKEN -u RK_REVIEW_BRANCH -u RK_REVIEW_HEAD -u RK_REVIEW_TARGET -u RK_REVIEW_TASK -u RK_REVIEW_ATTEMPT cargo nextest run --workspace --no-fail-fast --test-threads 4
env -u RK_AGENT -u RK_TASK -u RK_REPO -u RK_ROLE -u RK_HOME -u RK_BRANCH -u RK_WORKTREE -u RK_AUTH_TOKEN -u RK_REVIEW_BRANCH -u RK_REVIEW_HEAD -u RK_REVIEW_TARGET -u RK_REVIEW_TASK -u RK_REVIEW_ATTEMPT cargo test --workspace --doc -- --test-threads 4
cargo clippy --workspace --all-targets -- -D warnings
"""

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"
