[tools]
rust = "1.95.0"

[tasks.build]
description = "Build an optimized release build of rk"
run = "cargo build --release -p rk-cli"

[tasks.install]
description = "Build and install an optimized release build of rk"
run = "./scripts/install.sh"

[tasks.deploy]
description = "Build, install, and restart the daemon onto the freshly built rk binary"
run = """
./scripts/install.sh
RK="${RK_INSTALL_DIR:-$HOME/.local/bin}/rk"
"$RK" daemon stop || true
"$RK" ping >/dev/null
"$RK" daemon status
"""

[tasks.lint]
description = "Clippy over the whole workspace, warnings are errors"
# The committed tree is warning-clean under the pinned toolchain (TKT-180), so
# -D warnings is safe here and makes any output unambiguously YOUR change.
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the workspace test suite"
# `env -u RK_AGENT` is load-bearing, not hygiene. A rat's spawn env sets
# RK_AGENT, and rk_daemon::Client::connect reads it as the RPC `caller`; the
# daemon then refuses operator-only methods (workflow.run, agent.spawn, ...)
# with `forbidden`. So the suite passes for a human and fails for every rat
# running the very command its completion protocol demands. Tracked: TKT-182.
run = "env -u RK_AGENT cargo test --workspace"

[tasks.verify]
description = "Build, test, and lint — the checks a rat must pass before `rk done`"
run = """
cargo build --workspace
env -u RK_AGENT cargo test --workspace
cargo clippy --workspace --all-targets -- -D warnings
"""

[tasks.clean]
description = "Remove build artifacts"
run = "cargo clean"
