name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      # macOS is rk's actual runtime (single-operator laptop castle); it is
      # the blocking signal. The ubuntu leg has never been green — it keeps
      # surfacing platform assumptions (cue, tool probes) one layer at a
      # time — so it runs advisory-only until the portability backlog is
      # peeled (ticketed), and must not cancel the macOS leg.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rk-workflow validates workflow definitions by shelling out to the cue
      # CLI; without it the workflow/onboarding/product-to-code test families
      # all fail with "cue CLI not runnable".
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.12.0
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace --no-fail-fast
