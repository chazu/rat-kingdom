name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      # macOS is rk's actual runtime (single-operator laptop castle). The
      # ubuntu leg ran advisory-only while it peeled platform assumptions
      # (cue, tool probes) one layer at a time; by 2026-08 its only failures
      # were the same test races the macOS leg hit, so both legs now block.
      # `fail-fast: false` keeps one platform's failure from cancelling the
      # other's run, which is the signal that tells the two kinds apart.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # rk-workflow validates workflow definitions by shelling out to the cue
      # CLI; without it the workflow/onboarding/product-to-code test families
      # all fail with "cue CLI not runnable".
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.12.0
      - name: fmt
        run: cargo fmt --all --check
      # Cargo.lock is committed so every build — a contributor's, a rat's, a
      # CI runner's — resolves the identical dependency graph. `--locked`
      # turns a stale lockfile (a manifest edit without the matching
      # `cargo update`) into a build error here rather than a silent re-resolve
      # that only this runner sees.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        run: cargo test --workspace --no-fail-fast --locked
