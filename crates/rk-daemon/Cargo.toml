[package]
name = "rk-daemon"
description = "rat-kingdom daemon: NDJSON-over-UDS server, supervision, tuplespace host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rk-core.workspace = true
rk-space.workspace = true
rk-git.workspace = true
rk-harness.workspace = true
rk-ledger.workspace = true
rk-sync.workspace = true
rk-workflow.workspace = true
rk-mux.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
hex.workspace = true
sha2.workspace = true
libc.workspace = true
rand.workspace = true

[features]
# Builds `rk-fixture-done`, the fake harness's stand-in for `rk done`. Off in a
# normal build; switched on for this package's own tests by the self
# dev-dependency below, which is what makes `CARGO_BIN_EXE_rk-fixture-done`
# resolve in `tests/*` (see `tests/fixture/mod.rs`).
test-fixtures = []

[[bin]]
name = "rk-fixture-done"
path = "src/bin/rk-fixture-done.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
rk-daemon = { path = ".", features = ["test-fixtures"] }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
